name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  SDL_REF: release-3.4.18
  SDL_TTF_REF: release-3.2.2

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: libsdl-org/SDL
          ref: ${{ env.SDL_REF }}
          path: deps/SDL
      - uses: actions/checkout@v4
        with:
          repository: libsdl-org/SDL_ttf
          ref: ${{ env.SDL_TTF_REF }}
          path: deps/SDL_ttf
          submodules: recursive
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libpulse-dev libaudio-dev libjack-dev libsndio-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev libxss-dev libxtst-dev \
            libxkbcommon-dev libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev \
            libdbus-1-dev libibus-1.0-dev libudev-dev libpipewire-0.3-dev libwayland-dev libdecor-0-dev liburing-dev
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DSDL3_SOURCE_DIR=$PWD/deps/SDL -DSDL3_TTF_SOURCE_DIR=$PWD/deps/SDL_ttf
      - name: Build
        run: cmake --build build
      - name: Test
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: ctest --test-dir build --output-on-failure
      - name: Check distribution packages
        run: |
          sudo apt-get install -y rpm dpkg-dev
          mkdir -p dist-pkgs
          (cd build && cpack --config CPackConfig.cmake -B "$GITHUB_WORKSPACE/dist-pkgs")
          ls dist-pkgs

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: libsdl-org/SDL
          ref: ${{ env.SDL_REF }}
          path: deps/SDL
      - uses: actions/checkout@v4
        with:
          repository: libsdl-org/SDL_ttf
          ref: ${{ env.SDL_TTF_REF }}
          path: deps/SDL_ttf
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Android packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null
          "$SDKMANAGER" "platforms;android-35" "ndk;28.2.13676358" "cmake;3.22.1"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
          validate-wrappers: false
      - name: Build debug APK
        env:
          SDL3_SOURCE_DIR: ${{ github.workspace }}/deps/SDL
          SDL3_TTF_SOURCE_DIR: ${{ github.workspace }}/deps/SDL_ttf
        run: gradle -p android assembleDebug
